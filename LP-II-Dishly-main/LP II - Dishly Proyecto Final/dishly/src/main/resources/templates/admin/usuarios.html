<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dishly · Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'DM Sans', sans-serif; }
        .font-display { font-family: 'Syne', sans-serif; }
        .sidebar { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .nav-link { transition: all 0.2s; border-radius: 12px; color: #94a3b8; }
        .nav-link:hover, .nav-link.active { background: rgba(99,102,241,0.15); color: #fff; }
        .nav-link.active { background: rgba(99,102,241,0.2); border-left: 3px solid #6366f1; }
        .card { background:#fff; border-radius:20px; border:1px solid #f1f5f9; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
        .badge-pill { font-size:11px; padding:3px 12px; border-radius:999px; font-weight:600; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50; align-items:center; justify-content:center; }
        .modal-overlay.open { display:flex; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex">

<!-- SIDEBAR -->
<div th:replace="~{admin/fragments/sidebar :: sidebar(activeMenu='usuarios')}"></div>

<!-- MAIN -->
<main class="ml-64 flex-1 p-8">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">Usuarios</h1>
            <p class="text-sm text-slate-400 mt-1">Gestioná los usuarios registrados en la plataforma</p>
        </div>
    </div>

    <!-- Alertas -->
    <div th:if="${param.eliminado}" class="mb-4 px-5 py-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm">
        ✓ Usuario eliminado correctamente.
    </div>

    <!-- Stats rápidas -->
    <div class="grid grid-cols-3 gap-5 mb-6">
        <div class="card p-5">
            <p class="text-xs text-slate-400 mb-1">Total usuarios</p>
            <p class="text-2xl font-bold text-slate-800" th:text="${usuarios.size()}">0</p>
        </div>
        <div class="card p-5">
            <p class="text-xs text-slate-400 mb-1">Admins</p>
            <p class="text-2xl font-bold text-indigo-600" th:text="${totalAdmins}">0</p>
        </div>
        <div class="card p-5">
            <p class="text-xs text-slate-400 mb-1">Clientes</p>
            <p class="text-2xl font-bold text-green-600" th:text="${totalClientes}">0</p>
        </div>
    </div>

    <!-- Tabla usuarios -->
    <div class="card overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-slate-50 border-b border-slate-100">
                    <tr class="text-left text-xs uppercase tracking-wide text-slate-400">
                        <th class="px-6 py-4">#ID</th>
                        <th class="px-6 py-4">Usuario</th>
                        <th class="px-6 py-4">Email</th>
                        <th class="px-6 py-4">Rol</th>
                        <th class="px-6 py-4">Estado</th>
                        <th class="px-6 py-4">Pedidos</th>
                        <th class="px-6 py-4">Acciones</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                    <tr th:each="usuario : ${usuarios}" class="hover:bg-slate-50 transition">

                        <!-- ID -->
                        <td class="px-6 py-4 font-mono text-xs text-slate-400"
                            th:text="${usuario.idUsuario}"></td>

                        <!-- Usuario -->
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-400 to-violet-500
                                            flex items-center justify-center text-white text-sm font-bold shrink-0"
                                     th:text="${#strings.substring(usuario.nombre,0,1).toUpperCase()}">?</div>
                                <span class="font-medium text-slate-700" th:text="${usuario.nombre}">—</span>
                            </div>
                        </td>

                        <!-- Email -->
                        <td class="px-6 py-4 text-slate-500" th:text="${usuario.email}">—</td>

                        <!-- Roles -->
                        <td class="px-6 py-4">
                            <div class="flex flex-wrap gap-1">
                                <span th:each="rol : ${usuario.roles}"
                                      th:text="${rol.nombre.replace('ROLE_','')}"
                                      th:classappend="${rol.nombre == 'ROLE_ADMIN'} ? 'bg-indigo-100 text-indigo-700' :
                                                      (${rol.nombre == 'ROLE_STAFF'} ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700')"
                                      class="badge-pill">
                                </span>
                            </div>
                        </td>

                        <!-- Estado -->
                        <td class="px-6 py-4">
                            <span th:if="${usuario.estado}" class="badge-pill bg-green-100 text-green-700">● Activo</span>
                            <span th:unless="${usuario.estado}" class="badge-pill bg-red-100 text-red-700">● Inactivo</span>
                        </td>

                        <!-- Pedidos -->
                        <td class="px-6 py-4 text-slate-600 font-medium"
                            th:text="${usuario.pedidos != null ? usuario.pedidos.size() : 0}">0</td>

                        <!-- Acciones -->
                        <td class="px-6 py-4">
                            <form th:action="@{/admin/usuarios/eliminar}" method="post"
                                  onsubmit="return confirm('¿Estás seguro de eliminar este usuario?')">
                                <input type="hidden" name="id" th:value="${usuario.idUsuario}">
                                <button type="submit"
                                        class="text-xs font-medium text-red-500 hover:text-red-700
                                               bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition">
                                    <i class="fa-solid fa-trash-can mr-1"></i> Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>

                    <!-- Empty state -->
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="px-6 py-16 text-center text-slate-400">
                            <i class="fa-solid fa-users text-3xl mb-3 block"></i>
                            No hay usuarios registrados
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
