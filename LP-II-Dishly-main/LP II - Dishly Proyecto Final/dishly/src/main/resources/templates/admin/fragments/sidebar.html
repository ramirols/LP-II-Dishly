<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<body>

<!--/* SIDEBAR FRAGMENT - usar con th:replace="admin/fragments/sidebar :: sidebar(activeMenu='dashboard')" */-->
<aside th:fragment="sidebar(activeMenu)" class="sidebar fixed top-0 left-0 h-full w-64 flex flex-col z-40 shadow-2xl"
       style="background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);">

    <!-- Logo -->
    <div class="px-6 py-6 border-b border-white/10">
        <a href="/" class="font-display text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
            🍽️ Dishly
        </a>
        <p class="text-xs text-slate-400 mt-1" sec:authorize="hasRole('ADMIN')">Panel Administrador</p>
        <p class="text-xs text-slate-400 mt-1" sec:authorize="hasRole('STAFF')">Panel Staff</p>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">

        <!-- ── GENERAL: ADMIN y STAFF ── -->
        <p class="text-[10px] uppercase tracking-widest text-slate-500 px-3 mb-3">General</p>

        <a href="/admin/dashboard"
           th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''"
           class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl">
            <i class="fa-solid fa-gauge-high w-4 text-center"></i>
            Dashboard
        </a>

        <a href="/admin/pedidos"
           th:classappend="${activeMenu == 'pedidos'} ? 'active' : ''"
           class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl">
            <i class="fa-solid fa-bag-shopping w-4 text-center"></i>
            Pedidos
        </a>

        <a href="/admin/reportes"
           th:classappend="${activeMenu == 'reportes'} ? 'active' : ''"
           class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl">
            <i class="fa-solid fa-chart-bar w-4 text-center"></i>
            Reportes
        </a>

        <!-- ── CATALOGO: solo ADMIN ── -->
        <div sec:authorize="hasRole('ADMIN')">
            <p class="text-[10px] uppercase tracking-widest text-slate-500 px-3 mt-5 mb-3">Catálogo</p>

            <a href="/admin/platos/inicio"
               th:classappend="${activeMenu == 'platos'} ? 'active' : ''"
               class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl">
                <i class="fa-solid fa-utensils w-4 text-center"></i>
                Platos
            </a>

            <a href="/admin/categorias"
               th:classappend="${activeMenu == 'categorias'} ? 'active' : ''"
               class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl">
                <i class="fa-solid fa-tags w-4 text-center"></i>
                Categorías
            </a>
        </div>

        <!-- ── GESTION: solo ADMIN ── -->
        <div sec:authorize="hasRole('ADMIN')">
            <p class="text-[10px] uppercase tracking-widest text-slate-500 px-3 mt-5 mb-3">Gestión</p>

            <a href="/admin/usuarios"
               th:classappend="${activeMenu == 'usuarios'} ? 'active' : ''"
               class="nav-link flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl">
                <i class="fa-solid fa-users w-4 text-center"></i>
                Usuarios
            </a>
        </div>

    </nav>

    <!-- Info usuario + Cerrar sesión -->
    <div class="px-4 py-5 border-t border-white/10">
        <div class="flex items-center gap-3 px-3 mb-4">
            <div class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center text-white text-sm font-bold">
                <span th:text="${#strings.substring(adminNombre,0,1).toUpperCase()}">A</span>
            </div>
            <div class="min-w-0">
                <p class="text-sm font-semibold text-white truncate" th:text="${adminNombre}">Administrador</p>
                <p class="text-xs text-indigo-300 font-medium" sec:authorize="hasRole('ADMIN')">Admin</p>
                <p class="text-xs text-orange-300 font-medium" sec:authorize="hasRole('STAFF')">Staff</p>
            </div>
        </div>
        <a href="/logout"
           class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-red-400 hover:bg-red-500/10 hover:text-red-300 transition">
            <i class="fa-solid fa-right-from-bracket w-4 text-center"></i>
            Cerrar sesión
        </a>
    </div>
</aside>

</body>
</html>
