<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout/main}">

<div layout:fragment="content" class="bg-gray-50 min-h-screen flex items-center justify-center pt-[100px] pb-12">
    <div class="container mx-auto px-4">
        <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
            
            <div class="bg-green-50 p-10 text-center">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-6">
                    <i class="fa-solid fa-check text-4xl text-green-600"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">¡Pedido Confirmado!</h1>
                <p class="text-gray-600">Tu orden ha sido procesada con éxito y está en camino a la cocina.</p>
            </div>

            <div class="p-8 md:p-12">
                <div class="flex flex-col md:flex-row justify-between items-center mb-8 pb-8 border-b border-gray-100 gap-4">
                    <div class="text-center md:text-left">
                        <p class="text-sm text-gray-400 uppercase tracking-widest font-semibold">Número de Pedido</p>
                        <p class="text-2xl font-mono font-bold text-blue-600" th:text="'#' + ${pedidoId}"></p>
                    </div>
                    <div class="text-center md:text-right">
                        <p class="text-sm text-gray-400 uppercase tracking-widest font-semibold">Estado</p>
                        <span class="inline-flex items-center px-4 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-700">
                            <i class="fa-solid fa-clock mr-2"></i> Preparando
                        </span>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="flex items-start gap-4">
                        <div class="bg-gray-100 p-3 rounded-lg">
                            <i class="fa-solid fa-truck-fast text-gray-600"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800">Tiempo estimado</h3>
                            <p class="text-gray-600 text-sm">30 - 45 minutos</p>
                        </div>
                    </div>

                    <div class="flex items-start gap-4">
                        <div class="bg-gray-100 p-3 rounded-lg">
                            <i class="fa-solid fa-envelope text-gray-600"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800">Confirmación enviada</h3>
                            <p class="text-gray-600 text-sm">Hemos enviado los detalles a tu correo electrónico.</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-12">
                    <a th:href="@{/cliente/pedidos}" 
                       class="flex items-center justify-center gap-2 bg-gray-900 text-white font-bold py-4 rounded-xl hover:bg-gray-800 transition-all shadow-lg">
                        <i class="fa-solid fa-list-ul"></i>
                        Mis Pedidos
                    </a>
                    <a th:href="@{/}" 
                       class="flex items-center justify-center gap-2 bg-white text-blue-600 border-2 border-blue-600 font-bold py-4 rounded-xl hover:bg-blue-50 transition-all">
                        <i class="fa-solid fa-utensils"></i>
                        Seguir Comprando
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
