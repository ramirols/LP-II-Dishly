<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<div layout:fragment="content" class="bg-gray-50 min-h-screen py-12">
    <div class="container mx-auto px-4 max-w-5xl">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">Finalizar Pedido</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex items-center mb-4">
                        <span class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3">1</span>
                        <h2 class="text-xl font-semibold">Información de Entrega</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" placeholder="Dirección exacta" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                        <input type="text" placeholder="Teléfono de contacto" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex items-center mb-4">
                        <span class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3">2</span>
                        <h2 class="text-xl font-semibold">Método de Pago</h2>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <label class="border p-4 rounded-xl cursor-pointer hover:bg-blue-50 transition flex flex-col items-center gap-2 border-blue-200 bg-blue-50">
                            <input type="radio" name="pago" value="tarjeta" checked class="hidden">
                            <i class="fa-solid fa-credit-card text-2xl text-blue-600"></i>
                            <span class="text-sm font-medium">Tarjeta</span>
                        </label>
                        <label class="border p-4 rounded-xl cursor-pointer hover:bg-gray-50 transition flex flex-col items-center gap-2">
                            <input type="radio" name="pago" value="yape" class="hidden">
                            <span class="font-bold text-purple-600">Yape</span>
                            <span class="text-sm font-medium text-gray-600">QR / Celular</span>
                        </label>
                        <label class="border p-4 rounded-xl cursor-pointer hover:bg-gray-50 transition flex flex-col items-center gap-2">
                            <input type="radio" name="pago" value="efectivo" class="hidden">
                            <i class="fa-solid fa-money-bill-1-wave text-2xl text-green-600"></i>
                            <span class="text-sm font-medium">Efectivo</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-24">
                    <h2 class="text-xl font-bold mb-6">Resumen</h2>
                    
                    <div class="space-y-4 mb-6 max-h-64 overflow-y-auto pr-2">
                        <div th:each="item : ${cartItems}" class="flex justify-between items-center">
                            <div class="flex items-center">
                                <span class="bg-gray-100 text-gray-700 text-xs font-bold px-2 py-1 rounded mr-3" th:text="${item.cantidad} + 'x'"></span>
                                <div>
                                    <p class="text-sm font-semibold text-gray-800" th:text="${item.plato.nombre}"></p>
                                    <span class="text-xs text-gray-500 uppercase tracking-wider" th:text="${item.plato.categoria.nombre}"></span>
                                </div>
                            </div>
                            <p class="text-sm font-bold text-gray-700">S/ [[${item.subtotal}]]</p>
                        </div>
                    </div>

                    <div class="border-t pt-4 space-y-2">
                        <div class="flex justify-between text-gray-600">
                            <span>Subtotal</span>
                            <span>S/ [[${total}]]</span>
                        </div>
                        <div class="flex justify-between text-gray-600">
                            <span>Envío</span>
                            <span class="text-green-600 font-medium text-sm">Gratis</span>
                        </div>
                        <div class="flex justify-between text-xl font-bold text-gray-900 pt-2 border-t mt-4">
                            <span>Total</span>
                            <span class="text-blue-600">S/ [[${total}]]</span>
                        </div>
                    </div>

                    <button class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-8 hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">
                        Confirmar y Pagar
                    </button>
                    
                    <p class="text-center text-xs text-gray-400 mt-4 italic">
                        <i class="fa-solid fa-lock mr-1"></i> Pago 100% seguro con SSL
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
