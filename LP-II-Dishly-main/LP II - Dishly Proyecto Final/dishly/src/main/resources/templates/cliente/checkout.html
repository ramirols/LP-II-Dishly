<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<div layout:fragment="content" class="bg-gray-50 min-h-screen pt-[65px]">
    <div class="container mx-auto px-4 max-w-5xl pt-[50px] pb-[50px]">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">Finalizar Pedido</h1>

		<form th:action="@{/cliente/checkout/confirmar}" method="post">
		    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
		        <div class="lg:col-span-2 space-y-6">
		            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
		                <div class="flex items-center mb-4">
		                    <span class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3">1</span>
		                    <h2 class="text-xl font-semibold">Información de Entrega</h2>
		                </div>
		                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
		                    <input type="text" name="direccion" placeholder="Dirección exacta" required 
		                           class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-400">
		                </div>
		            </div>

		            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
		                <div class="flex items-center mb-4">
		                    <span class="bg-blue-100 text-blue-600 w-8 h-8 rounded-full flex items-center justify-center font-bold mr-3">2</span>
		                    <h2 class="text-xl font-semibold">Método de Pago</h2>
		                </div>
		                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
		                    <label class="border p-4 rounded-xl cursor-pointer hover:bg-blue-50 transition flex flex-col items-center gap-2">
		                        <input type="radio" name="pago" value="TARJETA" checked class="hidden peer">
		                        <div class="peer-checked:text-blue-600 flex flex-col items-center">
		                            <i class="fa-solid fa-credit-card text-2xl"></i>
		                            <span class="text-sm font-medium">Tarjeta</span>
		                        </div>
		                    </label>
		                    
		                    <label class="border p-4 rounded-xl cursor-pointer hover:bg-gray-50 transition flex flex-col items-center gap-2">
		                        <input type="radio" name="pago" value="YAPE" class="hidden peer">
		                        <div class="peer-checked:text-purple-600 flex flex-col items-center">
		                            <span class="font-bold">Yape</span>
		                            <span class="text-sm font-medium">QR / Celular</span>
		                        </div>
		                    </label>

		                    <label class="border p-4 rounded-xl cursor-pointer hover:bg-gray-50 transition flex flex-col items-center gap-2">
		                        <input type="radio" name="pago" value="EFECTIVO" class="hidden peer">
		                        <div class="peer-checked:text-green-600 flex flex-col items-center">
		                            <i class="fa-solid fa-money-bill-1-wave text-2xl"></i>
		                            <span class="text-sm font-medium">Efectivo</span>
		                        </div>
		                    </label>
		                </div>
		            </div>
		        </div>

		        <div class="lg:col-span-1 pb-5">
		            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-24">
						<h2 class="text-xl font-bold mb-6">Resumen</h2>

						<div class="space-y-4 mb-6 max-h-64 overflow-y-auto pr-2">
							<div th:each="item : ${cartItems}" class="flex justify-between items-center">
								<div class="flex items-center">
									<span class="bg-gray-100 text-gray-700 text-xs font-bold px-2 py-1 rounded mr-3" th:text="${item.cantidad} + 'x'"></span>
									<div>
									<p class="text-sm font-semibold text-gray-800" th:text="${item.plato.nombre}"></p>
									<span class="text-xs text-gray-500 uppercase tracking-wider" th:text="${item.plato.categoria.nombre}"></span>
									</div>
								</div>
									<p class="text-sm font-bold text-gray-700">S/ [[${item.subtotal}]]</p>
							</div>
							
		                	<button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-8 hover:bg-blue-700 transition-all shadow-lg">
		                    	Confirmar y Pagar
		                	</button>
		            	</div>
		        	</div>
		    	</div>
		</form>
    </div>
</div>
</html>
