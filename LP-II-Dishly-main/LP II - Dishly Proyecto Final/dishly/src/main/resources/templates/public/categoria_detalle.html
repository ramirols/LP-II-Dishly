<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<main layout:fragment="content">

  <!-- HEADER CATEGORÍA -->
  <section class="py-20 bg-gradient-to-r from-blue-600 to-indigo-600 text-white">
    <div class="container mx-auto px-4 text-center">
      <span class="inline-block text-sm bg-white/20 px-4 py-1 rounded-full mb-4">
        Categoría
      </span>

      <h1 th:text="${categoria.nombre}"
          class="text-4xl md:text-5xl font-bold mb-4">
      </h1>

      <p class="max-w-xl mx-auto opacity-90">
        Descubre todos los platos disponibles en esta categoría
      </p>
    </div>
  </section>

  <!-- LISTADO DE PLATOS -->
  <section class="py-24 bg-gray-50">
    <div class="container mx-auto px-4">

      <!-- Breadcrumb -->
      <div class="mb-10 text-sm text-gray-500">
        <a href="/" class="hover:text-blue-600">Inicio</a>
        <span class="mx-2">/</span>
        <span th:text="${categoria.nombre}"></span>
      </div>

      <!-- Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">

        <div th:each="plato : ${platos}"
             class="group bg-white rounded-2xl overflow-hidden border hover:shadow-xl transition">

          <!-- Imagen -->
          <div class="relative">
            <img th:src="@{/images/{img}(img=${plato.imagen})}"
                 class="w-full h-52 object-cover">

            <span th:if="${plato.estado}"
                  class="absolute top-3 left-3 bg-green-600 text-white text-xs px-3 py-1 rounded-full">
              Disponible
            </span>

            <span th:if="${!plato.estado}"
                  class="absolute top-3 left-3 bg-red-600 text-white text-xs px-3 py-1 rounded-full">
              No disponible
            </span>
          </div>

          <!-- Info -->
          <div class="p-5">

            <h3 th:text="${plato.nombre}"
                class="font-semibold text-lg mb-1 group-hover:text-blue-600 transition">
            </h3>

            <div class="flex justify-between items-center">

              <span class="text-lg font-bold text-blue-600">
                S/ <span th:text="${plato.precio}"></span>
              </span>

              <a th:href="@{/plato/{id}(id=${plato.id})}"
                 class="text-sm font-semibold text-blue-600 hover:underline">
                Ver detalle →
              </a>

            </div>
          </div>
        </div>

      </div>

      <div th:if="${#lists.isEmpty(platos)}"
           class="text-center py-20 text-gray-500">
        No hay platos disponibles en esta categoría.
      </div>

    </div>
  </section>

</main>
</html>
