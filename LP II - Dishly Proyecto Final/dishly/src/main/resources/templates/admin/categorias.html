<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dishly · Categorías</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'DM Sans', sans-serif; }
        .sidebar { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .nav-link { transition: all 0.2s; border-radius: 12px; color: #94a3b8; }
        .nav-link:hover, .nav-link.active { background: rgba(99,102,241,0.15); color: #fff; }
        .nav-link.active { background: rgba(99,102,241,0.2); border-left: 3px solid #6366f1; }
        .card { background:#fff; border-radius:20px; border:1px solid #f1f5f9; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
        .badge-pill { font-size:11px; padding:3px 12px; border-radius:999px; font-weight:600; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .input-field {
            width: 100%; padding: 10px 14px;
            border: 1px solid #e2e8f0; border-radius: 10px;
            font-size: 14px; outline: none; transition: border 0.2s;
        }
        .input-field:focus { border-color: #6366f1; }
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box { background:#fff; border-radius:20px; padding:2rem; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex">

<!-- SIDEBAR -->
<div th:replace="~{admin/fragments/sidebar :: sidebar(activeMenu='categorias')}"></div>

<!-- MAIN -->
<main class="ml-64 flex-1 p-8">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">Categorías</h1>
            <p class="text-sm text-slate-400 mt-1">Organizá las categorías del menú</p>
        </div>
        <button onclick="document.getElementById('modalGuardarCategoria').classList.add('open')"
                class="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700
                       text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-indigo-100">
            <i class="fa-solid fa-plus"></i> Nueva categoría
        </button>
    </div>

    <!-- Alertas -->
    <div th:if="${param.categoriaAgregada}" class="mb-4 px-5 py-3 bg-green-50 border border-green-200 text-green-700 rounded-xl text-sm">
        ✓ Categoría guardada correctamente.
    </div>
    <div th:if="${param.categoriaEliminada}" class="mb-4 px-5 py-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm">
        ✓ Categoría eliminada correctamente.
    </div>

    <!-- Grid de categorías -->
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
        <div th:each="cat : ${categorias}"
             class="card p-6 flex flex-col gap-3">
            <div class="flex items-start justify-between">
                <div>
                    <p class="font-bold text-slate-800 text-base" th:text="${cat.nombre}">—</p>
                    <p class="text-sm text-slate-400 mt-1" th:text="${cat.descripcion}">—</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-tag text-indigo-400"></i>
                </div>
            </div>
            <p class="text-xs text-slate-400">
                <span class="font-semibold text-slate-600"
                      th:text="${cat.platos != null ? cat.platos.size() : 0}">0</span> platos en esta categoría
            </p>
            <div class="flex gap-2 pt-1 border-t border-slate-100">
                <button type="button"
                        th:data-idcat="${cat.id}"
                        th:data-nombrecat="${cat.nombre}"
                        th:data-desc="${cat.descripcion}"
                        onclick="abrirEditar(this)"
                        class="text-xs font-medium text-indigo-600 bg-indigo-50
                               hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-pen mr-1"></i> Editar
                </button>
                <button type="button"
                        th:data-idcat="${cat.id}"
                        onclick="abrirEliminar(this)"
                        class="text-xs font-medium text-red-500 bg-red-50
                               hover:bg-red-100 px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-trash-can mr-1"></i> Eliminar
                </button>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(categorias)}"
             class="card p-12 text-center text-slate-400 col-span-3">
            <i class="fa-solid fa-tags text-3xl mb-3 block"></i>
            No hay categorías registradas aún
        </div>
    </div>
</main>

<!-- MODAL — Guardar / Editar categoría -->
<div id="modalGuardarCategoria" class="modal-overlay">
    <div class="modal-box">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold text-slate-800" id="tituloModalCat">Nueva Categoría</h2>
            <button onclick="document.getElementById('modalGuardarCategoria').classList.remove('open')"
                    class="text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <form method="post" th:object="${categoriaDTO}" th:action="@{/admin/platos/categoria/guardar}" class="space-y-4">
            <input type="hidden" th:field="*{id}" id="idcategoria"/>
            <div>
                <label class="text-sm font-medium text-slate-700 block mb-1">Nombre</label>
                <input th:field="*{nombre}" type="text" id="nombreCat"
                       class="input-field" placeholder="Ej: Entradas" required>
            </div>
            <div>
                <label class="text-sm font-medium text-slate-700 block mb-1">Descripción</label>
                <input th:field="*{descripcion}" type="text" id="descCat"
                       class="input-field" placeholder="Ej: Platos para empezar" required>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button"
                        onclick="document.getElementById('modalGuardarCategoria').classList.remove('open')"
                        class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-200 transition">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL — Eliminar categoría -->
<div id="modalEliminarCategoria" class="modal-overlay">
    <div class="modal-box" style="max-width:360px">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-trash-can text-red-500 text-2xl"></i>
            </div>
            <h2 class="text-lg font-bold text-slate-800">¿Eliminar categoría?</h2>
            <p class="text-sm text-slate-400 mt-1">Esta acción no se puede deshacer.</p>
        </div>
        <form method="post" th:object="${categoriaDTO}" th:action="@{/admin/platos/categoria/eliminar}">
            <input type="hidden" th:field="*{id}" id="idcategoriaEliminar"/>
            <div class="flex justify-center gap-3">
                <button type="button"
                        onclick="document.getElementById('modalEliminarCategoria').classList.remove('open')"
                        class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-200 transition">
                    Cancelar
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-red-500 text-white rounded-xl text-sm font-semibold hover:bg-red-600 transition">
                    Sí, eliminar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function abrirEditar(btn) {
        document.getElementById('tituloModalCat').textContent = 'Editar Categoría';
        document.getElementById('idcategoria').value = btn.dataset.idcat;
        document.getElementById('nombreCat').value   = btn.dataset.nombrecat;
        document.getElementById('descCat').value     = btn.dataset.desc;
        document.getElementById('modalGuardarCategoria').classList.add('open');
    }
    function abrirEliminar(btn) {
        document.getElementById('idcategoriaEliminar').value = btn.dataset.idcat;
        document.getElementById('modalEliminarCategoria').classList.add('open');
    }
</script>

</body>
</html>
