<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dishly · Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pedidos.css}">
</head>
<body class="bg-slate-50 min-h-screen flex">

<!-- SIDEBAR -->
<div th:replace="~{admin/fragments/sidebar :: sidebar(activeMenu='pedidos')}"></div>

<!-- MAIN -->
<main class="ml-64 flex-1 p-8">

    <!-- Header página -->
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-slate-800">Pedidos</h1>
        <p class="text-sm text-slate-400 mt-1">Gestioná y actualizá el estado de todos los pedidos</p>
    </div>

    <!-- Alertas -->
    <div th:if="${param.success}" class="mb-4 px-5 py-3 bg-green-50 border border-green-200 text-green-700 rounded-xl text-sm">
        ✓ Estado actualizado correctamente.
    </div>

    <!-- Filtros -->
    <div class="card p-5 mb-6 flex flex-wrap gap-3 items-center">
        <span class="text-sm font-medium text-slate-600">Filtrar por estado:</span>
        <a href="/admin/pedidos"
           th:classappend="${filtro == null || filtro == 'todos'} ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
           class="badge-pill transition">
            Todos
        </a>
        <a href="/admin/pedidos?filtro=pendientes"
           th:classappend="${filtro == 'pendientes'} ? 'bg-yellow-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
           class="badge-pill transition">
            Pendientes
        </a>
        <a href="/admin/pedidos?filtro=completados"
           th:classappend="${filtro == 'completados'} ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
           class="badge-pill transition">
            Completados
        </a>

        <!-- Resumen -->
        <div class="ml-auto flex gap-4 text-sm text-slate-500">
            <span>Total: <strong class="text-slate-800" th:text="${pedidos.size()}">0</strong></span>
        </div>
    </div>

    <!-- Tabla pedidos -->
    <div class="card overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-slate-50 border-b border-slate-100">
                    <tr class="text-left text-xs uppercase tracking-wide text-slate-400">
                        <th class="px-6 py-4">#ID</th>
                        <th class="px-6 py-4">Cliente</th>
                        <th class="px-6 py-4">Fecha</th>
                        <th class="px-6 py-4">Dirección</th>
                        <th class="px-6 py-4">Pago</th>
                        <th class="px-6 py-4">Total</th>
                        <th class="px-6 py-4">Estado</th>
                        <th class="px-6 py-4">Acción</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                    <tr th:each="pedido : ${pedidos}"
                        class="hover:bg-slate-50 transition">

                        <!-- ID -->
                        <td class="px-6 py-4 font-mono text-xs text-slate-400"
                            th:text="'#' + ${pedido.id}"></td>

                        <!-- Cliente -->
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center
                                            text-indigo-600 text-xs font-bold shrink-0"
                                     th:text="${#strings.substring(pedido.usuario.nombre,0,1).toUpperCase()}">?</div>
                                <div>
                                    <p class="font-medium text-slate-700" th:text="${pedido.usuario.nombre}">—</p>
                                    <p class="text-xs text-slate-400" th:text="${pedido.usuario.email}">—</p>
                                </div>
                            </div>
                        </td>

                        <!-- Fecha -->
                        <td class="px-6 py-4 text-slate-500 text-xs"
                            th:text="${#temporals.format(pedido.fechaCreacion,'dd/MM/yyyy HH:mm')}">—</td>

                        <!-- Dirección -->
                        <td class="px-6 py-4 text-slate-500 text-xs max-w-[160px] truncate"
                            th:text="${pedido.direccionEnvio != null ? pedido.direccionEnvio : '—'}">—</td>

                        <!-- Método pago -->
                        <td class="px-6 py-4">
                            <span class="badge-pill bg-slate-100 text-slate-600"
                                  th:text="${pedido.metodoPago != null ? pedido.metodoPago : '—'}"></span>
                        </td>

                        <!-- Total -->
                        <td class="px-6 py-4 font-semibold text-slate-800"
                            th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total,1,2)}">—</td>

                        <!-- Estado -->
                        <td class="px-6 py-4">
                            <span th:if="${pedido.estado}"
                                  class="badge-pill bg-green-100 text-green-700">✓ Completado</span>
                            <span th:unless="${pedido.estado}"
                                  class="badge-pill bg-yellow-100 text-yellow-700">⏳ Pendiente</span>
                        </td>

                        <!-- Acción -->
                        <td class="px-6 py-4">
                            <form th:action="@{/admin/pedidos/estado}" method="post">
                                <input type="hidden" name="id" th:value="${pedido.id}">
                                <input type="hidden" name="estado" th:value="${!pedido.estado}">
                                <button type="submit"
                                        th:text="${pedido.estado} ? 'Marcar pendiente' : 'Marcar completado'"
                                        class="text-xs font-medium text-indigo-600 hover:text-indigo-800
                                               bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">
                                </button>
                            </form>
                        </td>
                    </tr>

                    <!-- Empty state -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="8" class="px-6 py-16 text-center text-slate-400">
                            <i class="fa-solid fa-bag-shopping text-3xl mb-3 block"></i>
                            No hay pedidos registrados
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
